<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo M - Monochromatic ASCII Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .viewport {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(85vw, 85vh, 680px);
      aspect-ratio: 1;
    }
    #logo-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .hud {
      position: fixed;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 50;
    }
    .hud.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }
    .btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .phase-badge {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      min-width: 140px;
      text-align: center;
    }
    .scrubber {
      width: 120px;
      accent-color: #ffffff;
      cursor: pointer;
    }
    .tagline {
      position: fixed;
      top: 20px;
      font-size: 10px;
      letter-spacing: 0.2em;
      opacity: 0.4;
      text-transform: uppercase;
      pointer-events: none;
    }
  .hud,.tagline{display:none!important}.viewport{width:100vmin}
</style>
</head>
<body>
  <div class="tagline">fl-sibinas &bull; Letter M Construct</div>

  <div class="viewport">
    <canvas id="logo-canvas"></canvas>
  </div>

  <div class="hud" id="hud">
    <button class="btn" id="play-btn" title="Toggle Play / Pause (Space)">▶ PAUSE</button>
    <div class="phase-badge" id="phase-badge">INITIALIZING</div>
    <input type="range" class="scrubber" id="scrubber" min="0" max="1000" value="0" title="Scrub Timeline" />
    <button class="btn" id="speed-btn" title="Cycle Speed (0.5x, 1x, 2x)">1.0x</button>
    <button class="btn" id="theme-btn" title="Toggle Theme (T)">THEME</button>
    <button class="btn" id="fs-btn" title="Fullscreen (F)">FS</button>
  </div>

            name = 'SK Bringing Logo';
          } else if (p < 0.44) {
            const tLocal = (p - 0.28) / 0.16;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = smoothT;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'SK Disappearing';
          } else if (p < 0.70) {
            outOpacity = 1;
            asciiOpacity = 0;
            name = 'Pristine Logo';
          } else if (p < 0.84) {
            const tLocal = (p - 0.70) / 0.14;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = 1 - smoothT;
            asciiOpacity = smoothT * 0.95;
            name = 'SK Deconstructing';
          } else if (p < 0.95) {
            const tLocal = (p - 0.84) / 0.11;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = 0;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'Fade Out to Black';
          } else {
            outOpacity = 0;
            asciiOpacity = 0;
            name = 'Pure Black';
          }
        } else if (style === 'waterfall') {
          if (p < 0.05) {
            outOpacity = 0;
            asciiOpacity = 0;
            name = 'Pure Black';
          } else if (p < 0.28) {
            const localT = (p - 0.05) / 0.23;
            wave = localT;
            sweepBeamY = 120 + localT * 350;
            outOpacity = 0;
            asciiOpacity = 0.95;
            name = 'SK Waterfall';
          } else if (p < 0.44) {
            wave = 1.0;
            const localT = (p - 0.28) / 0.16;
            const smoothT = 0.5 - 0.5 * Math.cos(localT * Math.PI);
            outOpacity = smoothT;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'SK Disappearing';
          } else if (p < 0.70) {
            outOpacity = 1;
            asciiOpacity = 0;
            name = 'Pristine Logo';
          } else if (p < 0.84) {
            const localT = (p - 0.70) / 0.14;
            const smoothT = 0.5 - 0.5 * Math.cos(localT * Math.PI);
            sweepBeamY = 470 - smoothT * 350;
            outOpacity = 1 - smoothT;
            asciiOpacity = smoothT * 0.95;
            wave = 1.0 - smoothT;
            name = 'SK Deconstructing';
          } else if (p < 0.95) {
            const localT = (p - 0.84) / 0.11;
            const smoothT = 0.5 - 0.5 * Math.cos(localT * Math.PI);
            outOpacity = 0;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'Fade Out to Black';
          } else {
            outOpacity = 0;
            asciiOpacity = 0;
            name = 'Pure Black';
          }
        } else {
          // glitch
          if (p < 0.05) {
            outOpacity = 0;
            asciiOpacity = 0;
            name = 'Pure Black';
          } else if (p < 0.28) {
            const tLocal = (p - 0.05) / 0.23;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = 0;
            asciiOpacity = smoothT * 0.95;
            name = 'Cyber Glitch In';
          } else if (p < 0.44) {
            const tLocal = (p - 0.28) / 0.16;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = smoothT;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'SK Disappearing';
          } else if (p < 0.70) {
            outOpacity = 1;
            asciiOpacity = 0;
            name = 'Pristine Logo';
          } else if (p < 0.84) {
            const tLocal = (p - 0.70) / 0.14;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = 1 - smoothT;
            asciiOpacity = smoothT * 0.95;
            name = 'Cyber Glitch Out';
          } else if (p < 0.95) {
            const tLocal = (p - 0.84) / 0.11;
            const smoothT = 0.5 - 0.5 * Math.cos(tLocal * Math.PI);
            outOpacity = 0;
            asciiOpacity = (1 - smoothT) * 0.95;
            name = 'Fade Out to Black';
          } else {
            outOpacity = 0;
            asciiOpacity = 0;
            name = 'Pure Black';
          }

          const glitchActive = (p >= 0.18 && p <= 0.36) || (p >= 0.68 && p <= 0.86);
          if (glitchActive) {
            glitch = Math.sin(t * 3.7) * 6;
            strokeW = conf.strokeWidth + Math.sin(t * 5) * 1.5;
          }
        }

        const activeElements = [];
        const charList = (CHAR_SETS[conf.charSet] || CHAR_SETS.standard).chars;
        const len = charList.length;

        if (asciiOpacity > 0.005) {
          for (let i = 0; i < pts.length; i++) {
            const pt = pts[i];
            let char = pt.initialChar;
            let pointOpacity = asciiOpacity;

            if (style === 'continuous') {
              if (conf.flickerSpeed > 0) {
                const flickerSeed = (pt.col * 23 + pt.row * 37 + t) % 100;
                if (flickerSeed < 16) {
                  char = charList[(pt.id + t) % len];
                }
              }
              pointOpacity = 0.95 * (pt.isEdge ? 0.95 : 1.0);
            } else if (style === 'smooth-fade') {
              if (p >= 0.05 && p < 0.28) {
                const buildT = (p - 0.05) / 0.23;
                const pointRevealT = (pt.y / 600) * 0.55 + (Math.abs(pt.x - 300) / 300) * 0.35;
                const isSynthesizing = buildT < pointRevealT + 0.18;

                if (isSynthesizing) {
                  const decodeIdx = (pt.id * 11 + t * 2) % DECODE_GLYPHS.length;
                  char = DECODE_GLYPHS[decodeIdx];
                  pointOpacity = Math.min(asciiOpacity, Math.max(0.1, (buildT - pointRevealT + 0.18) / 0.18));
                } else if (conf.flickerSpeed > 0 && (pt.id + t) % 9 === 0) {
                  char = charList[(pt.id + t) % len];
                }
              } else if (p >= 0.84 && p < 0.95) {
                const fadeProgress = (p - 0.84) / 0.11;
                const pointFadeThreshold = (1 - (pt.y / 600)) * 0.4 + (Math.abs(pt.x - 300) / 300) * 0.4;
                if (fadeProgress > pointFadeThreshold) {
                  const dissolveIdx = (pt.id * 7 + t) % DISSOLVE_GLYPHS.length;
                  char = DISSOLVE_GLYPHS[dissolveIdx];
                  pointOpacity = Math.max(0, asciiOpacity * (1 - (fadeProgress - pointFadeThreshold) / 0.3));
                }
              } else if (conf.flickerSpeed > 0) {
                const flickerSeed = (pt.col * 23 + pt.row * 37 + t) % 100;
                if (flickerSeed < 16) {
                  char = charList[(pt.id + t) % len];
                }
              }
            } else if (style === 'waterfall') {
              if (p >= 0.05 && p < 0.28) {
                const normY = pt.normalizedY || ((pt.y - 141) / 318);
                const distFromWave = normY - wave;
                if (distFromWave > 0.06) continue;
                if (distFromWave >= -0.10 && distFromWave <= 0.06) {
                  char = DECODE_GLYPHS[(pt.id * 7 + t * 3) % DECODE_GLYPHS.length];
                } else if (conf.flickerSpeed > 0 && (pt.id + t) % 11 === 0) {
                  char = charList[(pt.id * 3) % len];
                }
              } else if (p >= 0.70 && p < 0.84) {
                const normY = pt.normalizedY || ((pt.y - 141) / 318);
                if (normY < wave - 0.05) continue;
                if (Math.abs(normY - wave) <= 0.08) {
                  char = DECODE_GLYPHS[(pt.id * 7 + t * 3) % DECODE_GLYPHS.length];
                }
              } else if (p >= 0.84 && p < 0.95) {
                char = DISSOLVE_GLYPHS[(pt.id + t) % DISSOLVE_GLYPHS.length];
              }
            } else {
              // glitch
              if (p >= 0.18 && p <= 0.36 && (pt.id + t) % 7 === 0) {
                char = DECODE_GLYPHS[(pt.id * 3 + t) % DECODE_GLYPHS.length];
              } else if (conf.flickerSpeed > 0 && (pt.col * 19 + pt.row * 29 + t) % 100 < 20) {
                char = charList[(pt.id + t) % len];
              }
            }

            if (pointOpacity > 0.01) {
              activeElements.push({ x: pt.x, y: pt.y, char, opacity: pointOpacity });
            }
          }
        }

        return {
          outlineOpacity: outOpacity,
          activeElements,
          phaseName: name,
          strokeWidth: strokeW,
          glitchOffset: glitch,
          sweepBeamY,
        };
      }

      function drawVectorM(context, conf, frameData) {
        if (frameData.outlineOpacity <= 0.01) return;
        context.save();
        if (frameData.glitchOffset !== 0) {
          context.translate(frameData.glitchOffset, 0);
        }
        context.globalAlpha = frameData.outlineOpacity;
        const fg = conf.theme === 'dark' ? '#ffffff' : '#000000';

        if (conf.outlineStyle !== 'stroke') {
          context.fillStyle = fg;
          if (pathLeft && pathRight) {
            context.fill(pathLeft);
            context.fill(pathRight);
          } else {
            drawFallbackM(context);
            context.fill();
          }
        }

        context.strokeStyle = fg;
        context.lineWidth = frameData.strokeWidth;
        context.lineCap = 'round';
        context.lineJoin = 'round';
        if (pathLeft && pathRight) {
          context.stroke(pathLeft);
          context.stroke(pathRight);
        } else {
          drawFallbackM(context);
          context.stroke();
        }
        context.restore();
      }

      function drawFallbackM(context) {
        context.beginPath();
        context.moveTo(120, 459);
        context.lineTo(120, 141);
        context.lineTo(298.2, 318.5);
        context.lineTo(298.2, 397.5);
        context.lineTo(206, 295);
        context.bezierCurveTo(192, 277, 166, 275, 166, 308);
        context.lineTo(166, 459);
        context.closePath();

        context.moveTo(301.8, 318.5);
        context.lineTo(480, 141);
        context.lineTo(480, 459);
        context.lineTo(434, 459);
        context.lineTo(434, 308);
        context.bezierCurveTo(434, 275, 408, 277, 394, 295);
        context.lineTo(301.8, 397.5);
        context.closePath();
      }

      function renderFrame(p, t) {
        const isDarkTheme = currentSettings.theme === 'dark';
        const bg = isDarkTheme ? '#000000' : '#ffffff';
        const fg = isDarkTheme ? '#ffffff' : '#000000';

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;

        ctx.save();
        ctx.scale(dpr, dpr);

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        const baseSize = 600;
        const scale = Math.min(w, h) / baseSize;
        const offX = (w - baseSize * scale) / 2;
        const offY = (h - baseSize * scale) / 2;

        ctx.translate(offX, offY);
        ctx.scale(scale, scale);

        const frameData = computeFrameState(p, t, points, currentSettings);

        // Update UI badge
        phaseBadge.textContent = frameData.phaseName;

        // 1. Grid
        if (currentSettings.showBoundingGrid) {
          ctx.strokeStyle = fg;
          ctx.globalAlpha = 0.06;
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 6]);
          ctx.strokeRect(100, 100, 400, 400);
          ctx.beginPath();
          ctx.moveTo(300, 80);
          ctx.lineTo(300, 520);
          ctx.moveTo(80, 300);
          ctx.lineTo(520, 300);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }

        // 2. ASCII Elements
        if (frameData.activeElements.length > 0) {
          const fontSize = Math.max(10, Math.round(baseSize / (currentSettings.gridDensity || 46)));
          ctx.font = 'bold ' + fontSize + 'px "JetBrains Mono", "SF Mono", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = fg;

          if (currentSettings.glowEffect) {
            ctx.shadowColor = isDarkTheme ? 'rgba(255, 255, 255, 0.65)' : 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 8;
          } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          for (let i = 0; i < frameData.activeElements.length; i++) {
            const el = frameData.activeElements[i];
            ctx.globalAlpha = el.opacity;
            ctx.fillText(el.char, el.x, el.y);
          }
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        }

        // 3. Vector Outline
        drawVectorM(ctx, currentSettings, frameData);

        // 4. Laser Scanline Beam
        if (frameData.sweepBeamY !== null && currentSettings.showScanlines) {
          ctx.save();
          ctx.strokeStyle = fg;
          ctx.globalAlpha = 0.35;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(60, frameData.sweepBeamY);
          ctx.lineTo(540, frameData.sweepBeamY);
          ctx.stroke();
          ctx.restore();
        }

        // 5. Terminal Scanline
        if (currentSettings.showScanlines) {
          ctx.save();
          ctx.strokeStyle = fg;
          ctx.globalAlpha = 0.08;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 6]);
          const scanY = (t * 4) % baseSize;
          ctx.beginPath();
          ctx.moveTo(0, scanY);
          ctx.lineTo(baseSize, scanY);
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
      }

      function loop(timestamp) {
        if (isPlaying && !isDraggingScrubber) {
          const delta = (timestamp - lastTime) / 1000;
          lastTime = timestamp;
          const cycleSec = duration / playbackSpeed;
          progress = (progress + (delta / cycleSec)) % 1.0;
          tick = Math.floor(progress * cycleSec * 60);
          scrubber.value = Math.round(progress * 1000);
        } else {
          lastTime = timestamp;
        }

        renderFrame(progress, tick);
        requestAnimationFrame(loop);
      }

      window.renderLogoFrame = renderFrame;
      if (location.search.includes("still")) renderFrame(0.55,0); else if (!location.search.includes("favicon")) requestAnimationFrame(loop);

      // Controls listeners
      function togglePlay() {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '▶ PAUSE' : '❚❚ PLAY';
      }

      playBtn.addEventListener('click', togglePlay);
      canvas.addEventListener('click', togglePlay);

      scrubber.addEventListener('input', (e) => {
        isDraggingScrubber = true;
        progress = Number(e.target.value) / 1000;
        tick = Math.floor(progress * duration * 60);
        renderFrame(progress, tick);
      });

      scrubber.addEventListener('change', () => {
        isDraggingScrubber = false;
      });

      speedBtn.addEventListener('click', () => {
        if (playbackSpeed === 1.0) playbackSpeed = 2.0;
        else if (playbackSpeed === 2.0) playbackSpeed = 0.5;
        else playbackSpeed = 1.0;
        speedBtn.textContent = playbackSpeed + 'x';
      });

      themeBtn.addEventListener('click', () => {
        currentSettings.theme = currentSettings.theme === 'dark' ? 'light' : 'dark';
        const isD = currentSettings.theme === 'dark';
        document.body.style.backgroundColor = isD ? '#000000' : '#ffffff';
        document.body.style.color = isD ? '#ffffff' : '#000000';
        hud.style.background = isD ? 'rgba(20, 20, 20, 0.85)' : 'rgba(245, 245, 245, 0.85)';
        hud.style.borderColor = isD ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.15)';
      });

      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'KeyF') {
          fsBtn.click();
        } else if (e.code === 'KeyT') {
          themeBtn.click();
        } else if (e.code === 'KeyH') {
          hud.classList.toggle('hidden');
        } else if (e.code === 'KeyR') {
          progress = 0;
          tick = 0;
          scrubber.value = 0;
        }
      });
    })();
  </script>
</body>
</html>
